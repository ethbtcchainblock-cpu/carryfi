name: CarryFi Alerts

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Restore alert cache
        uses: actions/cache@v4
        with:
          path: alert_cache.json
          key: carryfi-alert-cache-${{ github.run_id }}
          restore-keys: |
            carryfi-alert-cache-

      - name: Run alert check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          APR_ALERT_THRESHOLD: ${{ vars.APR_ALERT_THRESHOLD || '20' }}
        run: python alert_runner.py

      - name: Monitor PH comments + auto-reply
        env:
          PH_TOKEN: ${{ secrets.PH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: python ph_monitor.py

      - name: Notify admin on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_ADMIN_CHAT_ID}" \
            -d "parse_mode=Markdown" \
            --data-urlencode "text=🚨 CarryFi alert job FAILED. Check: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
