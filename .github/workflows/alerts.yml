name: CarryFi Alerts + Keep-Alive

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 min — alerts + keep Render awake
  workflow_dispatch:

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Restore alert cache
        uses: actions/cache@v4
        with:
          path: alert_cache.json
          key: carryfi-alert-cache-${{ github.run_id }}
          restore-keys: |
            carryfi-alert-cache-

      - name: Run alert check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          APR_ALERT_THRESHOLD: ${{ vars.APR_ALERT_THRESHOLD || '20' }}
        run: python alert_runner.py

      - name: Keep Render awake
        if: always()
        run: curl -sf https://carryfi-dashboard.onrender.com/health > /dev/null || true
