name: CarryFi Alerts

on:
  schedule:
    - cron: '*/15 * * * *'  # every 15 minutes, 24/7, free on public repos
  workflow_dispatch:         # manual trigger from GitHub UI

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Restore alert cache
        uses: actions/cache@v4
        with:
          path: alert_cache.json
          key: carryfi-alert-cache-${{ github.run_id }}
          restore-keys: |
            carryfi-alert-cache-

      - name: Run alert check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          APR_ALERT_THRESHOLD: ${{ vars.APR_ALERT_THRESHOLD }}
        run: python alert_runner.py
