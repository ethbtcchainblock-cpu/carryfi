<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#0f0e08"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0b429" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f0b429" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle top glow -->
  <ellipse cx="600" cy="0" rx="500" ry="200" fill="url(#glow)"/>

  <!-- Border -->
  <rect x="1" y="1" width="1198" height="628" rx="0" fill="none" stroke="#f0b429" stroke-width="1" stroke-opacity="0.12"/>

  <!-- Logo bolt -->
  <g transform="translate(80, 80)">
    <rect width="72" height="72" rx="16" fill="#111"/>
    <rect x="0.5" y="0.5" width="71" height="71" rx="15.5" fill="none" stroke="#f0b429" stroke-width="1" stroke-opacity="0.4"/>
    <polygon points="42,10 22,40 31,40 27,62 54,34 44,34" fill="#f0b429"/>
  </g>

  <!-- Brand name -->
  <text x="172" y="130" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif" font-weight="800" font-size="42" fill="#f0b429" letter-spacing="-1">CarryFi</text>

  <!-- Main headline -->
  <text x="80" y="260" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif" font-weight="800" font-size="72" fill="#ffffff" letter-spacing="-2">Earn 20–100%+ APR</text>
  <text x="80" y="350" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif" font-weight="800" font-size="72" fill="#ffffff" letter-spacing="-2">with <tspan fill="#f0b429">zero price risk</tspan></text>

  <!-- Subline -->
  <text x="80" y="420" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif" font-weight="400" font-size="28" fill="#888">Telegram alerts for funding rate farming · 5 exchanges · 2,500+ markets</text>

  <!-- Stat pills -->
  <!-- Pill 1 -->
  <rect x="80" y="480" width="180" height="56" rx="12" fill="#111" stroke="#1e1e1e" stroke-width="1"/>
  <text x="170" y="502" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif" font-size="11" fill="#555" text-anchor="middle" text-transform="uppercase" letter-spacing="1">MARKETS</text>
  <text x="170" y="526" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif" font-weight="800" font-size="22" fill="#f0b429" text-anchor="middle">2,500+</text>

  <!-- Pill 2 -->
  <rect x="276" y="480" width="180" height="56" rx="12" fill="#111" stroke="#1e1e1e" stroke-width="1"/>
  <text x="366" y="502" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif" font-size="11" fill="#555" text-anchor="middle" letter-spacing="1">ALERT SPEED</text>
  <text x="366" y="526" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif" font-weight="800" font-size="22" fill="#f0b429" text-anchor="middle">15 min</text>

  <!-- Pill 3 -->
  <rect x="472" y="480" width="180" height="56" rx="12" fill="#111" stroke="#1e1e1e" stroke-width="1"/>
  <text x="562" y="502" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif" font-size="11" fill="#555" text-anchor="middle" letter-spacing="1">PRICE RISK</text>
  <text x="562" y="526" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif" font-weight="800" font-size="22" fill="#4ade80" text-anchor="middle">$0</text>

  <!-- Pill 4 -->
  <rect x="668" y="480" width="180" height="56" rx="12" fill="#111" stroke="#1e1e1e" stroke-width="1"/>
  <text x="758" y="502" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif" font-size="11" fill="#555" text-anchor="middle" letter-spacing="1">MONITORING</text>
  <text x="758" y="526" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif" font-weight="800" font-size="22" fill="#f0b429" text-anchor="middle">24/7</text>

  <!-- Right side: mock alert card -->
  <g transform="translate(870, 180)">
    <rect width="270" height="220" rx="16" fill="#1e2433" stroke="#2a3550" stroke-width="1"/>
    <!-- Header -->
    <circle cx="28" cy="28" r="14" fill="#f0b429"/>
    <text x="28" y="34" font-family="sans-serif" font-size="14" fill="#000" text-anchor="middle">⚡</text>
    <text x="52" y="24" font-family="-apple-system,sans-serif" font-size="11" fill="#7fb3ff" font-weight="600">CarryFi Alerts</text>
    <text x="52" y="38" font-family="-apple-system,sans-serif" font-size="10" fill="#444">just now</text>
    <!-- Content -->
    <text x="20" y="72" font-family="-apple-system,sans-serif" font-size="11" fill="#f0b429" font-weight="700">🚨 CarryFi Alert</text>
    <text x="20" y="96" font-family="-apple-system,sans-serif" font-size="13" fill="#fff" font-weight="700">XMR · Hyperliquid</text>
    <text x="20" y="118" font-family="-apple-system,sans-serif" font-size="11" fill="#888">Rate: </text>
    <rect x="52" y="106" width="80" height="16" rx="4" fill="#0d1117"/>
    <text x="56" y="118" font-family="monospace" font-size="11" fill="#7fb3ff">+0.0126%/1h</text>
    <text x="20" y="142" font-family="-apple-system,sans-serif" font-size="11" fill="#888">APR: </text>
    <rect x="48" y="130" width="60" height="16" rx="4" fill="#0d1117"/>
    <text x="52" y="142" font-family="monospace" font-size="11" fill="#f0b429" font-weight="700">110.4%</text>
    <text x="20" y="170" font-family="-apple-system,sans-serif" font-size="10" fill="#666">Long spot + Short perp</text>
    <text x="20" y="186" font-family="-apple-system,sans-serif" font-size="10" fill="#666">Delta neutral · no price risk 🟢</text>
  </g>
</svg>
